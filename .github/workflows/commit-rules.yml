name: Code Quality

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master, develop ]

jobs:
  # Check code style, run lint and tests
  code-quality:
    name: Code Quality and Tests
    permissions:
      contents: read
      pull-requests: write
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    strategy:
      fail-fast: false
      matrix: # mac osは特に高いので、コスト面の問題でubuntu以外を偶にしか走らないように設定する必要がある場合がある。
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew (Linux/Mac only)
        if: runner.os != 'Windows'
        run: chmod +x gradlew
        
      - name: Apply code style with Spotless (Linux/Mac)
        if: runner.os != 'Windows'
        run: ./gradlew spotlessApply
      
      - name: Apply code style with Spotless (Windows)
        if: runner.os == 'Windows'
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon.timeout=60000 -Xmx2g -Xms1g"
        run: ./gradlew.bat spotlessApply --daemon --parallel
        
      - name: Build and run tests (Linux/Mac)
        if: runner.os != 'Windows'
        run: ./gradlew build
      
      - name: Build and run tests (Windows)
        if: runner.os == 'Windows'
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon.timeout=60000 -Xmx2g -Xms1g"
        run: ./gradlew.bat build --daemon --parallel



  verify-known-bugs:
    name: Verify Known Bugs Still Exist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify known bugs are not accidentally fixed
        run: ./gradlew verifyKnownBugs
