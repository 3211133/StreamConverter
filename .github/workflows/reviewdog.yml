name: reviewdog
on: [pull_request]

jobs:
  checkstyle:
    name: Checkstyle with reviewdog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Checkstyle
        run: ./gradlew check
        continue-on-error: true

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run reviewdog for main and test
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in main test; do
            cat ./build/reports/checkstyle/$file.xml | reviewdog -f=checkstyle -name="checkstyle" -reporter="github-pr-review"
          done
