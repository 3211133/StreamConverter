version: '3.8'

services:
  # StreamConverter Web API Service
  streamconverter-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: streamconverter/web:1.2.0
    container_name: streamconverter-web
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xms512m -Xmx2g -XX:+UseContainerSupport
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - streamconverter-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    depends_on:
      - redis
      - postgres

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: streamconverter-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - streamconverter-network
    command: redis-server --appendonly yes
    restart: unless-stopped

  # PostgreSQL for metadata and configuration storage
  postgres:
    image: postgres:15-alpine
    container_name: streamconverter-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=streamconverter
      - POSTGRES_USER=streamconverter
      - POSTGRES_PASSWORD=streamconverter123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - streamconverter-network
    restart: unless-stopped

  # Development environment (optional)
  streamconverter-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: streamconverter/dev:1.2.0
    container_name: streamconverter-dev
    ports:
      - "8081:8080"  # Web port
      - "5005:5005"  # Debug port
    environment:
      - SPRING_PROFILES_ACTIVE=development
      - JAVA_OPTS=-Xms1g -Xmx3g -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    volumes:
      - .:/workspace
      - gradle-cache:/home/gradle/.gradle
    networks:
      - streamconverter-network
    profiles:
      - development
    depends_on:
      - redis
      - postgres

  # Nginx reverse proxy (for production deployment)
  nginx:
    image: nginx:alpine
    container_name: streamconverter-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - streamconverter-network
    profiles:
      - production
    depends_on:
      - streamconverter-web
    restart: unless-stopped

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: streamconverter-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - streamconverter-network
    profiles:
      - monitoring
    restart: unless-stopped

  # Grafana for metrics visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: streamconverter-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - streamconverter-network
    profiles:
      - monitoring
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  streamconverter-network:
    driver: bridge
    name: streamconverter-network

volumes:
  redis-data:
    name: streamconverter-redis-data
  postgres-data:
    name: streamconverter-postgres-data
  prometheus-data:
    name: streamconverter-prometheus-data
  grafana-data:
    name: streamconverter-grafana-data
  gradle-cache:
    name: streamconverter-gradle-cache